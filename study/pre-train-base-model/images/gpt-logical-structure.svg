<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">nanochat GPT 的逻辑计算结构</title>
  <desc id="desc">展示 token id 经 embedding、smear、多层 Transformer、backout、lm head 后得到 loss 或 logits，并展开 Block 和 Attention 内部。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .section{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .box-title{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .shape{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#475569}
      .arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">nanochat GPT：逻辑计算结构</text>

  <text x="55" y="100" class="section">主数据流</text>
  <rect x="55" y="125" width="180" height="86" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="145" y="155" text-anchor="middle" class="box-title">输入 idx</text>
  <text x="145" y="181" text-anchor="middle" class="body">token id</text>
  <text x="145" y="200" text-anchor="middle" class="shape">(B, T)</text>

  <rect x="275" y="125" width="210" height="86" rx="12" fill="#dcfce7" stroke="#4ade80"/>
  <text x="380" y="155" text-anchor="middle" class="box-title">wte + RMSNorm</text>
  <text x="380" y="181" text-anchor="middle" class="body">查表得到连续向量</text>
  <text x="380" y="200" text-anchor="middle" class="shape">(B, T, C)</text>
  <path d="M235 168 H275" class="arrow"/>

  <rect x="525" y="125" width="210" height="86" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="630" y="155" text-anchor="middle" class="box-title">Smear</text>
  <text x="630" y="181" text-anchor="middle" class="body">门控混入前一 token embedding</text>
  <text x="630" y="200" text-anchor="middle" class="shape">保存为 x0</text>
  <path d="M485 168 H525" class="arrow"/>

  <rect x="775" y="105" width="300" height="126" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="925" y="137" text-anchor="middle" class="box-title">重复 N 层 Transformer</text>
  <text x="925" y="164" text-anchor="middle" class="body">x ← residλ[i]·x + x0λ[i]·x0</text>
  <text x="925" y="189" text-anchor="middle" class="body">可选 value embedding → Block[i]</text>
  <text x="925" y="214" text-anchor="middle" class="shape">始终保持 (B, T, C)</text>
  <path d="M735 168 H775" class="arrow"/>

  <rect x="1115" y="125" width="205" height="86" rx="12" fill="#fee2e2" stroke="#f87171"/>
  <text x="1217" y="155" text-anchor="middle" class="box-title">Backout + Norm</text>
  <text x="1217" y="181" text-anchor="middle" class="body">减去部分中层 residual</text>
  <text x="1217" y="200" text-anchor="middle" class="shape">(B, T, C)</text>
  <path d="M1075 168 H1115" class="arrow"/>

  <rect x="1360" y="125" width="185" height="86" rx="12" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1452" y="155" text-anchor="middle" class="box-title">lm_head</text>
  <text x="1452" y="181" text-anchor="middle" class="body">裁剪 padding + softcap</text>
  <text x="1452" y="200" text-anchor="middle" class="shape">(B,T,V)</text>
  <path d="M1320 168 H1360" class="arrow"/>

  <path d="M1452 211 V270 H1320" class="arrow"/>
  <rect x="1065" y="245" width="255" height="78" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1192" y="276" text-anchor="middle" class="box-title">targets 存在：训练</text>
  <text x="1192" y="301" text-anchor="middle" class="body">cross_entropy → scalar loss</text>
  <path d="M1452 211 V356 H1320" class="arrow"/>
  <rect x="1065" y="337" width="255" height="78" rx="12" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="1192" y="368" text-anchor="middle" class="box-title">targets 为空：推理</text>
  <text x="1192" y="393" text-anchor="middle" class="body">直接返回 logits</text>

  <text x="55" y="480" class="section">一个 Block 内部：两次 pre-norm 残差更新</text>
  <rect x="65" y="515" width="170" height="78" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="150" y="547" text-anchor="middle" class="box-title">输入 x</text>
  <text x="150" y="573" text-anchor="middle" class="shape">(B,T,C)</text>
  <rect x="275" y="515" width="190" height="78" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="370" y="547" text-anchor="middle" class="box-title">RMSNorm</text>
  <text x="370" y="573" text-anchor="middle" class="body">无可学习参数</text>
  <path d="M235 554 H275" class="arrow"/>
  <rect x="505" y="495" width="275" height="118" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="642" y="528" text-anchor="middle" class="box-title">CausalSelfAttention</text>
  <text x="642" y="554" text-anchor="middle" class="body">token 之间交换信息</text>
  <text x="642" y="579" text-anchor="middle" class="body">可接收 value embedding / KV cache</text>
  <text x="642" y="600" text-anchor="middle" class="shape">(B,T,C) → (B,T,C)</text>
  <path d="M465 554 H505" class="arrow"/>
  <rect x="820" y="515" width="180" height="78" rx="12" fill="#dcfce7" stroke="#4ade80"/>
  <text x="910" y="547" text-anchor="middle" class="box-title">残差相加</text>
  <text x="910" y="573" text-anchor="middle" class="body">x ← x + attention</text>
  <path d="M780 554 H820" class="arrow"/>
  <path d="M150 593 V640 H910 V593" class="thin"/>
  <rect x="1040" y="515" width="170" height="78" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1125" y="547" text-anchor="middle" class="box-title">RMSNorm</text>
  <text x="1125" y="573" text-anchor="middle" class="body">再次 pre-norm</text>
  <path d="M1000 554 H1040" class="arrow"/>
  <rect x="1250" y="495" width="220" height="118" rx="12" fill="#fee2e2" stroke="#f87171"/>
  <text x="1360" y="528" text-anchor="middle" class="box-title">MLP</text>
  <text x="1360" y="554" text-anchor="middle" class="body">C → 4C → ReLU² → C</text>
  <text x="1360" y="579" text-anchor="middle" class="body">逐 token 变换特征</text>
  <text x="1360" y="600" text-anchor="middle" class="shape">(B,T,C) → (B,T,C)</text>
  <path d="M1210 554 H1250" class="arrow"/>
  <rect x="1485" y="495" width="90" height="118" rx="12" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1530" y="542" text-anchor="middle" class="box-title">残差</text>
  <text x="1530" y="570" text-anchor="middle" class="body">+ x'</text>
  <path d="M1470 554 H1485" class="arrow"/>
  <path d="M910 593 V674 H1530 V613" class="thin"/>

  <text x="55" y="745" class="section">Attention 内部：决定“当前 token 从哪些过去 token 读取什么”</text>
  <rect x="65" y="785" width="175" height="86" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="152" y="817" text-anchor="middle" class="box-title">norm(x)</text>
  <text x="152" y="844" text-anchor="middle" class="shape">(B,T,C)</text>
  <rect x="280" y="765" width="270" height="126" rx="12" fill="#dcfce7" stroke="#4ade80"/>
  <text x="415" y="797" text-anchor="middle" class="box-title">c_q / c_k / c_v</text>
  <text x="415" y="824" text-anchor="middle" class="shape">q: (B,T,H,D)</text>
  <text x="415" y="849" text-anchor="middle" class="shape">k,v: (B,T,Hkv,D)</text>
  <text x="415" y="874" text-anchor="middle" class="body">部分层：gate × value embedding 加到 v</text>
  <path d="M240 828 H280" class="arrow"/>
  <rect x="590" y="765" width="250" height="126" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="715" y="797" text-anchor="middle" class="box-title">RoPE + QK Norm</text>
  <text x="715" y="824" text-anchor="middle" class="body">RoPE 只旋转 q、k</text>
  <text x="715" y="849" text-anchor="middle" class="body">归一化后各乘 1.2</text>
  <text x="715" y="874" text-anchor="middle" class="shape">形状不变</text>
  <path d="M550 828 H590" class="arrow"/>
  <rect x="880" y="755" width="290" height="146" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="1025" y="787" text-anchor="middle" class="box-title">Flash Attention / SDPA</text>
  <text x="1025" y="814" text-anchor="middle" class="body">causal：不能读取未来 token</text>
  <text x="1025" y="839" text-anchor="middle" class="body">window：部分层只看局部历史</text>
  <text x="1025" y="864" text-anchor="middle" class="body">推理时读取并更新 KV cache</text>
  <text x="1025" y="887" text-anchor="middle" class="shape">(B,T,H,D)</text>
  <path d="M840 828 H880" class="arrow"/>
  <rect x="1210" y="765" width="290" height="126" rx="12" fill="#fee2e2" stroke="#f87171"/>
  <text x="1355" y="797" text-anchor="middle" class="box-title">拼接 heads + c_proj</text>
  <text x="1355" y="824" text-anchor="middle" class="shape">(B,T,H,D) → (B,T,C)</text>
  <text x="1355" y="849" text-anchor="middle" class="body">返回 residual stream</text>
  <text x="1355" y="874" text-anchor="middle" class="body">Block 再完成残差相加</text>
  <path d="M1170 828 H1210" class="arrow"/>

  <rect x="55" y="970" width="1490" height="102" rx="14" fill="#e2e8f0"/>
  <text x="800" y="1003" text-anchor="middle" class="box-title">先抓主干，再看增强</text>
  <text x="800" y="1032" text-anchor="middle" class="body">标准主干：token embedding → N × (attention + MLP) → lm_head → loss / logits</text>
  <text x="800" y="1058" text-anchor="middle" class="body">nanochat 增强：smear、value embedding、resid/x0 lambdas、backout、sliding window、logit softcap</text>
</svg>
