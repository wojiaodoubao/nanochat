<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">GPT 的 PyTorch Module 物理对象结构</title>
  <desc id="desc">展示 GPT 对象内部注册的 Module、Parameter、buffer 和普通 Python 属性，以及主要权重形状。</desc>
  <defs>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .node-title{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .shape{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#475569}
      .edge{stroke:#64748b;stroke-width:2;fill:none}
      .legend{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1600" height="1160" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">GPT：PyTorch Module / Parameter / buffer 物理对象树</text>

  <rect x="620" y="78" width="360" height="84" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="800" y="111" text-anchor="middle" class="node-title">GPT(nn.Module)</text>
  <text x="800" y="137" text-anchor="middle" class="body">整个模型的所有者与统一入口</text>

  <path d="M800 162 V205 H245 V235" class="edge"/>
  <path d="M800 205 H625 V235" class="edge"/>
  <path d="M800 205 H995 V235" class="edge"/>
  <path d="M800 205 H1370 V235" class="edge"/>

  <rect x="70" y="235" width="350" height="92" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="245" y="268" text-anchor="middle" class="node-title">transformer : ModuleDict</text>
  <text x="245" y="294" text-anchor="middle" class="body">主干 Module 的命名容器</text>
  <text x="245" y="315" text-anchor="middle" class="shape">wte + h</text>

  <rect x="470" y="235" width="310" height="92" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="625" y="268" text-anchor="middle" class="node-title">lm_head : Linear</text>
  <text x="625" y="294" text-anchor="middle" class="body">隐藏向量映射回词表</text>
  <text x="625" y="315" text-anchor="middle" class="shape">weight [Vp, C]</text>

  <rect x="825" y="235" width="340" height="92" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="995" y="268" text-anchor="middle" class="node-title">value_embeds : ModuleDict</text>
  <text x="995" y="294" text-anchor="middle" class="body">隔层创建，最后一层必有</text>
  <text x="995" y="315" text-anchor="middle" class="shape">Embedding weight [Vp, Hkv·D]</text>

  <rect x="1210" y="235" width="320" height="92" rx="12" fill="#fce7f3" stroke="#ec4899"/>
  <text x="1370" y="268" text-anchor="middle" class="node-title">顶层直接 Parameter</text>
  <text x="1370" y="294" text-anchor="middle" class="shape">resid_lambdas [N], x0_lambdas [N]</text>
  <text x="1370" y="315" text-anchor="middle" class="shape">smear_lambda [1], backout_lambda [1]</text>

  <path d="M245 327 V370 H155 V400" class="edge"/>
  <path d="M245 370 H350 V400" class="edge"/>

  <rect x="35" y="400" width="240" height="94" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="155" y="433" text-anchor="middle" class="node-title">wte : Embedding</text>
  <text x="155" y="459" text-anchor="middle" class="body">token id 查表</text>
  <text x="155" y="481" text-anchor="middle" class="shape">weight [Vp, C]</text>

  <rect x="305" y="400" width="300" height="94" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="455" y="433" text-anchor="middle" class="node-title">h : ModuleList[N]</text>
  <text x="455" y="459" text-anchor="middle" class="body">按层注册 Block[0...N-1]</text>
  <text x="455" y="481" text-anchor="middle" class="shape">每个 Block 保持 hidden width C</text>

  <path d="M455 494 V545 H310 V575" class="edge"/>
  <path d="M455 545 H605 V575" class="edge"/>

  <rect x="145" y="575" width="330" height="100" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="310" y="608" text-anchor="middle" class="node-title">attn : CausalSelfAttention</text>
  <text x="310" y="634" text-anchor="middle" class="body">q/k/v 投影、RoPE、attention、输出投影</text>
  <text x="310" y="657" text-anchor="middle" class="shape">可选 ve_gate</text>

  <rect x="505" y="575" width="300" height="100" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="655" y="608" text-anchor="middle" class="node-title">mlp : MLP</text>
  <text x="655" y="634" text-anchor="middle" class="body">逐 token 的非线性特征变换</text>
  <text x="655" y="657" text-anchor="middle" class="shape">c_fc + c_proj</text>

  <path d="M310 675 V720 H100 V750" class="edge"/>
  <path d="M310 720 H270 V750" class="edge"/>
  <path d="M310 720 H440 V750" class="edge"/>
  <path d="M310 720 H610 V750" class="edge"/>
  <path d="M310 720 H790 V750" class="edge"/>

  <rect x="25" y="750" width="150" height="90" rx="10" fill="#fce7f3" stroke="#ec4899"/>
  <text x="100" y="782" text-anchor="middle" class="node-title">c_q</text>
  <text x="100" y="808" text-anchor="middle" class="shape">[C, C]</text>
  <text x="100" y="829" text-anchor="middle" class="body">Parameter</text>
  <rect x="195" y="750" width="150" height="90" rx="10" fill="#fce7f3" stroke="#ec4899"/>
  <text x="270" y="782" text-anchor="middle" class="node-title">c_k</text>
  <text x="270" y="808" text-anchor="middle" class="shape">[Hkv·D, C]</text>
  <text x="270" y="829" text-anchor="middle" class="body">Parameter</text>
  <rect x="365" y="750" width="150" height="90" rx="10" fill="#fce7f3" stroke="#ec4899"/>
  <text x="440" y="782" text-anchor="middle" class="node-title">c_v</text>
  <text x="440" y="808" text-anchor="middle" class="shape">[Hkv·D, C]</text>
  <text x="440" y="829" text-anchor="middle" class="body">Parameter</text>
  <rect x="535" y="750" width="150" height="90" rx="10" fill="#fce7f3" stroke="#ec4899"/>
  <text x="610" y="782" text-anchor="middle" class="node-title">c_proj</text>
  <text x="610" y="808" text-anchor="middle" class="shape">[C, C]</text>
  <text x="610" y="829" text-anchor="middle" class="body">Parameter</text>
  <rect x="705" y="750" width="170" height="90" rx="10" fill="#fce7f3" stroke="#ec4899"/>
  <text x="790" y="782" text-anchor="middle" class="node-title">ve_gate?</text>
  <text x="790" y="808" text-anchor="middle" class="shape">[Hkv, 12]</text>
  <text x="790" y="829" text-anchor="middle" class="body">部分层存在</text>

  <path d="M655 675 V720 H970 V750" class="edge"/>
  <path d="M970 720 H1170 V750" class="edge"/>
  <rect x="885" y="750" width="190" height="90" rx="10" fill="#fce7f3" stroke="#ec4899"/>
  <text x="980" y="782" text-anchor="middle" class="node-title">c_fc</text>
  <text x="980" y="808" text-anchor="middle" class="shape">[4C, C]</text>
  <text x="980" y="829" text-anchor="middle" class="body">Parameter</text>
  <rect x="1095" y="750" width="200" height="90" rx="10" fill="#fce7f3" stroke="#ec4899"/>
  <text x="1195" y="782" text-anchor="middle" class="node-title">c_proj</text>
  <text x="1195" y="808" text-anchor="middle" class="shape">[C, 4C]</text>
  <text x="1195" y="829" text-anchor="middle" class="body">Parameter</text>

  <rect x="1210" y="400" width="320" height="94" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1370" y="433" text-anchor="middle" class="node-title">smear_gate : Linear</text>
  <text x="1370" y="459" text-anchor="middle" class="body">顶层注册的小型 Module</text>
  <text x="1370" y="481" text-anchor="middle" class="shape">weight [1, 24]</text>
  <path d="M1370 205 H1570 V447 H1530" class="edge"/>

  <rect x="930" y="575" width="270" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1230" y="548" text-anchor="middle" class="body">GPT 顶层还直接持有</text>
  <text x="1065" y="608" text-anchor="middle" class="node-title">cos / sin : buffer</text>
  <text x="1065" y="634" text-anchor="middle" class="shape">[1, 10Tmax, 1, D/2]</text>
  <text x="1065" y="657" text-anchor="middle" class="body">persistent=False，不写入 checkpoint</text>

  <rect x="1240" y="575" width="290" height="100" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1385" y="608" text-anchor="middle" class="node-title">普通 Python 属性</text>
  <text x="1385" y="634" text-anchor="middle" class="body">config、window_sizes、rotary_seq_len</text>
  <text x="1385" y="657" text-anchor="middle" class="body">不属于 Parameter / buffer</text>

  <rect x="70" y="910" width="1460" height="174" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="105" y="945" class="node-title">为什么“注册关系”重要？</text>
  <text x="105" y="976" class="body">• model.parameters() 能递归找到全部可训练 Parameter，autograd 将梯度写入它们的 .grad。</text>
  <text x="105" y="1005" class="body">• setup_optimizer() 可以按模型语义分组；optimizer 保存的是这些 Parameter 的引用。</text>
  <text x="105" y="1034" class="body">• state_dict() 递归导出参数和 persistent buffer；cos/sin 会由 init_weights() 重建，因此不保存。</text>
  <text x="105" y="1063" class="body">• train()/eval()、to_empty(device) 等 nn.Module 操作会沿这棵对象树递归传播。</text>

  <rect x="330" y="1105" width="18" height="18" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="358" y="1120" class="legend">Module</text>
  <rect x="520" y="1105" width="18" height="18" rx="3" fill="#fce7f3" stroke="#ec4899"/>
  <text x="548" y="1120" class="legend">Parameter / 含 Parameter 的叶子层</text>
  <rect x="855" y="1105" width="18" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="883" y="1120" class="legend">buffer</text>
  <rect x="1040" y="1105" width="18" height="18" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1068" y="1120" class="legend">普通 Python metadata</text>
</svg>
